services:
  - type: web
    name: selo
    env: node
    plan: starter
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: selo-db
          property: connectionString
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        value: selo-tria
      - key: JWT_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://selo.triagest.com

  - type: pserv
    name: selo-db
    plan: starter
    ipAddress:
      - key: DATABASE_URL
        value: postgres://${{POSTGRES_USER}}:${{POSTGRES_PASSWORD}}@${{POSTGRES_HOSTNAME}}:5432/${{POSTGRES_DATABASE}}
